name: Translation request
description: Ask for a new language or offer to help translate Since Us.
title: "Translation: "
labels: ["translation request"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for wanting to bring Since Us to more people!
        Translations happen on Weblate: https://hosted.weblate.org/engage/since-us/
        If you want to translate yourself, you can start there right away, also with a new language.
        A language is added to the app once it is (almost) complete. Use this form if you want to ask for a language or have a question about translating.
  - type: input
    id: language
    attributes:
      label: Language
      description: Which language would you like to see?
      placeholder: e.g. Spanish
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Can you help translate?
      options:
        - Yes, I'd like to help translate
        - No, I'm just requesting it
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Optional, for example if you are a native speaker or have translated apps before.
