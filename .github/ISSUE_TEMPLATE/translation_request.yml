name: Translation request
description: Ask for a new language or offer to help translate Since Us.
title: "Translation: "
labels: ["translation request"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for wanting to bring Since Us to more people!
        Right now the app is only available in English and German, because those are the languages I can check myself.
        Requests are collected here, so I know which languages are wanted most when I add more.
  - type: input
    id: language
    attributes:
      label: Language
      description: Which language would you like to see?
      placeholder: e.g. Spanish
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Can you help translate?
      options:
        - Yes, I'd like to help translate
        - No, I'm just requesting it
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Optional, for example if you are a native speaker or have translated apps before.
