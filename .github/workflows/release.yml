name: Release

# Neues Release: versionCode/versionName erhöhen, committen, dann z. B. "git tag v2.1.0 && git push --tags"
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Signing secrets are missing, see RELEASING.md" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Check version matches tag
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version" >&2
            exit 1
          fi

      - name: Build
        run: ./gradlew testGithubDebugUnitTest assembleGithubRelease bundlePlayRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/github/release/app-github-release.apk "SinceUs-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: SinceUs-${{ github.ref_name }}.apk
          generate_release_notes: true

      # Das Bundle für Google Play wird nicht öffentlich veröffentlicht, nur als Artefakt abgelegt
      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle-${{ github.ref_name }}
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
