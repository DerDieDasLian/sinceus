name: Release

# Erstellt ein neues Release, aber nur auf Knopfdruck (Actions > Release > Run workflow).
# Änderungen auf main sammeln sich so lange, bis bewusst eine neue Version veröffentlicht wird.
# Jeder Tag wird auch von F-Droid automatisch gebaut, deshalb lieber wenige, gut geprüfte Releases.
#
# Ablauf (siehe .github/scripts/next-version.sh und check-release.sh):
# 1. Version bestimmen (Art: auto, patch, minor oder major)
# 2. Prüfen: Änderungsnotizen für die neue Version in Deutsch und Englisch vorhanden und kurz genug
# 3. Tests und alle Varianten bauen, erst danach Version committen und Release mit Tag erstellen
# 4. Bundle mit Versionshinweisen automatisch zu Google Play hochladen (eigener Job "play")
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Art der neuen Version (auto: [minor]/[major] aus den Commit-Nachrichten, sonst patch)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      force:
        description: "Auch ohne App-Änderung ein neues Release erstellen"
        type: boolean
        default: false
      play:
        description: "Neue Version auch automatisch zu Google Play hochladen"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          FORCE: ${{ inputs.force }}
          BUMP: ${{ inputs.bump }}
        run: |
          .github/scripts/next-version.sh | tee -a "$GITHUB_OUTPUT"
          echo "tag=v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Nothing to release
        if: steps.version.outputs.release != 'true'
        run: echo "::notice::Seit dem letzten Release hat sich an der App nichts geändert, kein neues Release."

      - name: Check release notes
        if: steps.version.outputs.release == 'true'
        run: .github/scripts/check-release.sh "${{ steps.version.outputs.code }}"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        if: steps.version.outputs.release == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        if: steps.version.outputs.release == 'true'

      - name: Set up signing key
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Signing secrets are missing (UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD)" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # Die neue Version wird VOR dem Build lokal committet, aber erst nach grünem Build gepusht.
      # Die APK enthält die Commit-ID, aus der sie gebaut wurde (META-INF/version-control-info.textproto).
      # F-Droid baut den Tag nach und vergleicht Byte für Byte, deshalb muss der Build genau auf
      # dem Commit laufen, auf den später der Tag zeigt.
      - name: Commit new version
        id: commit
        if: steps.version.outputs.release == 'true'
        run: |
          if [ "${{ steps.version.outputs.changed }}" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/build.gradle.kts
            git commit -m "Version ${{ steps.version.outputs.version }}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.version.outputs.release == 'true'
        run: ./gradlew testGithubDebugUnitTest assembleGithubRelease assembleFdroidRelease bundlePlayRelease

      # Erst wenn Tests und Build durchgelaufen sind, wird die neue Version festgeschrieben.
      # Der Tag zeigt immer auf genau den Stand, der gebaut wurde (wichtig für F-Droid).
      # Kam während des Builds etwas Neues auf main dazu, wird die Version per Merge übernommen
      # statt den Push abzulehnen; die neuen Änderungen kommen dann ins nächste Release.
      - name: Push new version
        if: steps.version.outputs.release == 'true'
        run: |
          if [ "${{ steps.version.outputs.changed }}" = "true" ]; then
            branch="${{ github.ref_name }}"
            for attempt in 1 2 3 4 5; do
              git fetch origin "$branch"
              if ! git merge-base --is-ancestor "origin/$branch" HEAD; then
                git merge --no-edit -m "Version ${{ steps.version.outputs.version }} übernehmen" "origin/$branch"
              fi
              if git push origin "HEAD:$branch"; then exit 0; fi
              sleep $((attempt * 5))
            done
            echo "::error::Version konnte nicht nach $branch gepusht werden" >&2
            exit 1
          fi

      - name: Prepare files
        if: steps.version.outputs.release == 'true'
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk "SinceUs-${{ steps.version.outputs.tag }}.apk"
          # Gleiche Datei mit festem Namen: .../releases/latest/download/SinceUs.apk lädt immer die neueste Version
          cp app/build/outputs/apk/github/release/app-github-release.apk SinceUs.apk
          cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "SinceUs-${{ steps.version.outputs.tag }}-fdroid.apk.bin"
          notes=fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt
          if [ -f "$notes" ]; then cp "$notes" notes.md; else echo "" > notes.md; fi
          # Prüfsummen, damit man den Download prüfen kann
          sha256sum "SinceUs-${{ steps.version.outputs.tag }}.apk" SinceUs.apk > SHA256SUMS.txt
          # Für Google Play: Bundle und fertige Versionshinweise (so wie die Play Console sie erwartet) in einem Ordner
          mkdir play
          cp app/build/outputs/bundle/playRelease/app-play-release.aab play/
          for lang in de-DE en-US; do
            echo "<$lang>"
            cat "fastlane/metadata/android/$lang/changelogs/${{ steps.version.outputs.code }}.txt"
            echo "</$lang>"
          done > play/versionshinweise.txt
          # Gleiche Hinweise als einzelne Dateien für den automatischen Upload (Job "play")
          mkdir play/whatsnew
          for lang in de-DE en-US; do
            cp "fastlane/metadata/android/$lang/changelogs/${{ steps.version.outputs.code }}.txt" "play/whatsnew/whatsnew-$lang"
          done

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: steps.version.outputs.release == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: Since Us ${{ steps.version.outputs.tag }}
          body_path: notes.md
          generate_release_notes: true
          files: |
            SinceUs-${{ steps.version.outputs.tag }}.apk
            SinceUs.apk
            SHA256SUMS.txt

      # F-Droid-Variante mit unserer Signatur: F-Droid baut sie nach, vergleicht sie (Reproducible Builds)
      # und liefert dann diese Signatur aus. Endung .apk.bin, damit ältere App-Versionen sie nicht als Update laden.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: steps.version.outputs.release == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: SinceUs-${{ steps.version.outputs.tag }}-fdroid.apk.bin

      # Das Bundle für Google Play wird nicht öffentlich veröffentlicht, nur als Artefakt abgelegt,
      # zusammen mit den Versionshinweisen zum Einfügen in der Play Console
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.version.outputs.release == 'true'
        with:
          name: play-bundle-${{ steps.version.outputs.tag }}
          path: play/
          # Reicht zum Hochladen in die Play Console, spart Actions-Speicher
          retention-days: 30

  # Lädt das Bundle automatisch in Google Play hoch, in die Testphase aus der Repo-Variable PLAY_TRACK
  # (ohne Variable: "alpha", das ist der Standard-Track für geschlossene Tests).
  # Eigener Job: Scheitert nur der Upload, reicht "Re-run failed jobs", das Release wird nicht wiederholt.
  # Fehlt das Secret PLAY_SERVICE_ACCOUNT_JSON, wird nur ein Hinweis angezeigt und nichts hochgeladen.
  play:
    needs: release
    if: needs.release.outputs.release == 'true' && inputs.play
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check Play access
        id: access
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::warning::Secret PLAY_SERVICE_ACCOUNT_JSON fehlt, das Bundle bitte von Hand in der Play Console hochladen (Artefakt play-bundle-${{ needs.release.outputs.tag }})."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.access.outputs.ok == 'true'
        with:
          name: play-bundle-${{ needs.release.outputs.tag }}
          path: play

      - name: Upload to Google Play
        if: steps.access.outputs.ok == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.sinceus
          releaseFiles: play/app-play-release.aab
          releaseName: ${{ needs.release.outputs.tag }}
          track: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}
          whatsNewDirectory: play/whatsnew
