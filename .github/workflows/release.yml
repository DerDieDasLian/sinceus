name: Release

# Erstellt automatisch ein GitHub-Release, sobald auf dem Hauptbranch App-Code geändert wird.
# Die Version wird dabei automatisch erhöht (siehe .github/scripts/next-version.sh):
# normal die letzte Stelle, mit [minor] oder [major] in einer Commit-Nachricht die entsprechende.
on:
  push:
    branches: ["**"]
    paths: ["app/**", "!app/src/test/**"]
  workflow_dispatch:
    inputs:
      force:
        description: "Auch ohne App-Änderung ein neues Release erstellen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          FORCE: ${{ inputs.force }}
        run: |
          .github/scripts/next-version.sh | tee -a "$GITHUB_OUTPUT"
          echo "tag=v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Commit new version
        id: commit
        if: steps.version.outputs.release == 'true'
        run: |
          if [ "${{ steps.version.outputs.changed }}" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/build.gradle.kts fastlane/metadata/android
            git commit -m "Version ${{ steps.version.outputs.version }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        if: steps.version.outputs.release == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        if: steps.version.outputs.release == 'true'

      - name: Set up signing key
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Signing secrets are missing (UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD)" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        if: steps.version.outputs.release == 'true'
        run: ./gradlew testGithubDebugUnitTest assembleGithubRelease assembleFdroidRelease bundlePlayRelease

      - name: Prepare files
        if: steps.version.outputs.release == 'true'
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk "SinceUs-${{ steps.version.outputs.tag }}.apk"
          # Gleiche Datei mit festem Namen: .../releases/latest/download/SinceUs.apk lädt immer die neueste Version
          cp app/build/outputs/apk/github/release/app-github-release.apk SinceUs.apk
          cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "SinceUs-${{ steps.version.outputs.tag }}-fdroid.apk.bin"
          notes=fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt
          if [ -f "$notes" ]; then cp "$notes" notes.md; else echo "" > notes.md; fi

      - uses: softprops/action-gh-release@v3
        if: steps.version.outputs.release == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: Since Us ${{ steps.version.outputs.tag }}
          body_path: notes.md
          generate_release_notes: true
          files: |
            SinceUs-${{ steps.version.outputs.tag }}.apk
            SinceUs.apk

      # F-Droid-Variante mit unserer Signatur: F-Droid baut sie nach, vergleicht sie (Reproducible Builds)
      # und liefert dann diese Signatur aus. Endung .apk.bin, damit ältere App-Versionen sie nicht als Update laden.
      - uses: softprops/action-gh-release@v3
        if: steps.version.outputs.release == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: SinceUs-${{ steps.version.outputs.tag }}-fdroid.apk.bin

      # Das Bundle für Google Play wird nicht öffentlich veröffentlicht, nur als Artefakt abgelegt
      - uses: actions/upload-artifact@v7
        if: steps.version.outputs.release == 'true'
        with:
          name: play-bundle-${{ steps.version.outputs.tag }}
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
