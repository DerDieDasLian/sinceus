name: Website images

# Erstellt die Bilder der Website (docs/img) und die Store-Screenshots neu aus der App
# und speichert sie unter den gleichen Dateinamen, damit alle Links gleich bleiben.
# Start von Hand: Actions > Website images > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Render screens, widgets and share pictures
        run: >
          ./gradlew testGithubDebugUnitTest
          --tests 'app.sinceus.ui.ScreenshotTest'
          --tests 'app.sinceus.widget.WidgetRenderTest'
          --tests 'app.sinceus.share.ShareCardTest'

      - name: Convert into website and store images
        run: |
          pip install --quiet pillow
          python3 .github/scripts/website-images.py

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/img fastlane/metadata/android/*/images/phoneScreenshots
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Website und Store: Bilder neu erstellt"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
