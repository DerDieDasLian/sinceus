name: Website on own server

# Lädt docs/ bei jeder Änderung per FTPS auf den Webspace bei All-Inkl hoch (funktioniert mit jedem Tarif).
# Läuft nur, wenn die Variable WEB_FTP_HOST gesetzt ist.
# Einrichtung unter Settings > Secrets and variables > Actions:
#   Variables: WEB_FTP_HOST (z. B. w0123456.kasserver.com), WEB_FTP_USER, optional WEB_FTP_PATH (Standard /)
#   Secrets:   WEB_FTP_PASSWORD
# Am besten einen eigenen FTP-Zugang anlegen, der nur den Ordner der Website sieht.
on:
  push:
    branches: ["**"]
    paths: ["docs/**"]
  workflow_dispatch:

concurrency:
  group: website-server
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.WEB_FTP_HOST != '' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload with FTPS
        env:
          HOST: ${{ vars.WEB_FTP_HOST }}
          USER: ${{ vars.WEB_FTP_USER }}
          TARGET: ${{ vars.WEB_FTP_PATH || '/' }}
          LFTP_PASSWORD: ${{ secrets.WEB_FTP_PASSWORD }}
        run: |
          # Alles hochladen, auf dem Server gelöschte Dateien ebenfalls löschen (.htaccess bleibt)
          lftp -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            open --env-password -u $USER $HOST;
            mirror --reverse --delete --no-perms --verbose --exclude-glob .htaccess docs/ $TARGET;
            bye
          "
