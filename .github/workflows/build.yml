name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Erinnert daran, die Änderungsnotizen für das nächste Release zu schreiben
      - name: Release notes for next version
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$last_tag" ] && ! git diff --quiet "$last_tag" HEAD -- app/ ':!app/src/test'; then
            next=$(( $(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts) + 1 ))
            .github/scripts/check-release.sh "$next" 2>&1 | sed 's/^::error/::warning/' || true
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Tests
        run: ./gradlew testGithubDebugUnitTest
      - name: Build all variants
        run: ./gradlew assembleGithubRelease assembleFdroidRelease bundlePlayRelease

      - uses: actions/upload-artifact@v7
        with:
          name: since-us-apks
          path: app/build/outputs/apk/*/release/*.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-and-store-graphics
          path: |
            app/build/screenshots/
            app/build/store/
