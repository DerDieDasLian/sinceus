name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Der Lauf darf das Repository nur lesen
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Im PR: keine alten Notizen ändern, und bei App-Änderungen die Notiz für die nächste Version
      - name: Release notes in pull request
        if: github.event_name == 'pull_request'
        run: .github/scripts/check-changelogs.sh "origin/${{ github.base_ref }}"

      # Erinnert daran, die Änderungsnotizen für das nächste Release zu schreiben
      - name: Release notes for next version
        if: github.event_name != 'pull_request'
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$last_tag" ] && ! git diff --quiet "$last_tag" HEAD -- app/ ':!app/src/test'; then
            next=$(( $(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts) + 1 ))
            .github/scripts/check-release.sh "$next" 2>&1 | sed 's/^::error/::warning/' || true
          fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Tests
        run: ./gradlew testGithubDebugUnitTest
      - name: Build all variants
        run: ./gradlew assembleGithubRelease assembleFdroidRelease bundlePlayRelease
      # Findet z. B. Aufrufe, die auf älteren Android-Versionen abstürzen, und kaputte Platzhalter
      # in Übersetzungen. Nur Fehler lassen den Lauf scheitern, Einstellungen dazu in lint.xml.
      - name: Lint
        run: ./gradlew lintGithubDebug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: since-us-apks
          path: app/build/outputs/apk/*/release/*.apk
          # Nur zum kurzen Nachschauen, spart Actions-Speicher
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: screenshots-and-store-graphics
          path: |
            app/build/screenshots/
            app/build/store/
          retention-days: 3
