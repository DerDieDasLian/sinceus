# Öffnet einmal im Monat je einen gesammelten PR, wenn es neuere Versionen gibt:
# einen für die Werkzeuge der Build-Abläufe und einen für die Bibliotheken der App.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      # Kleine Updates gesammelt. Große Sprünge (z. B. Android Gradle Plugin 9, Gradle 9)
      # kommen als eigener PR, weil sie oft Umbauten am Build brauchen.
      gradle:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Brauchen Android Gradle Plugin 9 und compileSdk 37. Erst nach diesem Umbau wieder freigeben,
    # sonst ist jeder Sammel-PR rot.
    ignore:
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">=2026.09.0"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.19.0"]
      - dependency-name: "io.coil-kt.coil3:*"
        versions: [">=3.6.0"]
